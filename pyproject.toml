[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "Assistente agentivo de dados para consultas de negócio em SQLite"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-core>=1,<2",
  "langgraph>=1,<2",
  "pydantic>=2.10,<3",
  "sqlglot>=26,<30",
  "streamlit>=1.45,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py312"
line-length = 100
